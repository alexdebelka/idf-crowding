; PlatformIO build of the keychain (not tried yet; the tested build is arduino-cli, see README.md).
[platformio]
src_dir = apoint

[env:t-display-s3]
platform = espressif32@6.9.0          ; Arduino core for ESP32 2.0.17
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@7.2.1
monitor_speed = 115200
