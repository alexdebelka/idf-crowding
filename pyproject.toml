[project]
name = "idf-crowding"
version = "0.0.1"
description = "Forecast crowding at Île-de-France rail stations by day and hour from open data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastexcel>=0.11",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "polars>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
idf-disruptions = "idf_crowding.live.disruptions:main"
idf-ingest = "idf_crowding.ingest.cli:main"
idf-features = "idf_crowding.features.build:main"
idf-clean = "idf_crowding.clean.build:main"
idf-backtest = "idf_crowding.models.backtest:main"
idf-deep = "idf_crowding.models.deep:main"
idf-forecast = "idf_crowding.models.forecast:main"
idf-busy = "idf_crowding.models.busy:main"
idf-score = "idf_crowding.score.build:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.6",
]
explore = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
# explore (notebook + clustering) is used by tests/test_viz_eda.py, so install it by default.
default-groups = ["dev", "explore"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idf_crowding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
